<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Mini Museum Exhibit</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      AFRAME.registerComponent('tappable-artifact', {
        init: function () {
          let el = this.el;
          let isLarge = false;
          
          el.addEventListener('click', function () {
            isLarge = !isLarge;
            if (isLarge) {
              el.setAttribute('scale', '1.4 1.4 1.4');
            } else {
              el.setAttribute('scale', '1 1 1');
            }
          });
        }
      });

      AFRAME.registerComponent('color-change-ball', {
        init: function () {
          let el = this.el;
          let colors = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33'];
          let colorIndex = 0;

          el.addEventListener('click', function () {
            colorIndex = (colorIndex + 1) % colors.length;
            el.setAttribute('material', 'color', colors[colorIndex]);
          });
        }
      });

      AFRAME.registerComponent('banner-handler', {
        init: function () {
          let marker = document.querySelector('#hiro-marker');
          let banner = document.querySelector('#status-banner');

          marker.addEventListener('markerFound', function () {
            banner.style.backgroundColor = '#28a745';
            banner.innerHTML = 'Exhibit Active: Marker Found!';
          });

          marker.addEventListener('markerLost', function () {
            banner.style.backgroundColor = '#dc3545';
            banner.innerHTML = 'Searching for Hiro Marker... Please point camera at marker.';
          });
        }
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden;" banner-handler>

    <div id="status-banner" style="position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; text-align: center; z-index: 999; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; padding: 12px; background: #dc3545; color: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background 0.3s ease;">
      Searching for Hiro Marker... Please point camera at marker.
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" raycaster cursor="rayOrigin: mouse; fuse: false;" vr-mode-ui="enabled: false">
      
      <a-marker preset="hiro" id="hiro-marker">

        <a-cylinder position="0 0 0" radius="0.6" height="0.1" color="#333333"></a-cylinder>

        <a-box position="0.7 0.05 0" width="0.4" height="0.1" depth="0.25" color="#553311" rotation="0 -30 0"></a-box>

        <a-text value="Ancient Relic Exhibit\nTap objects to interact!" position="-0.8 0.6 -0.5" rotation="-45 0 0" scale="0.5 0.5 0.5" color="#ffffff" align="center"></a-text>

        <a-sphere position="-0.4 0.4 0" radius="0.15" color="#FF5733" color-change-ball 
                  animation="property: position; to: -0.4 0.6 0; dir: alternate; dur: 1500; loop: true">
        </a-sphere>

        <a-gltf-model src="assets/artifact.glb" position="0 0.2 0" scale="0.5 0.5 0.5" tappable-artifact
                      animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true">
        </a-gltf-model>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
